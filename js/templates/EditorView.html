<div class="toolbar">
  <button id="back">← Übersicht</button>
  <button class="primary" id="save">Speichern</button>
</div>

<div class="card">
  <h1 id="viewTitle">Bewerbung</h1>

  <div class="field">
    <label>Stellenanzeige / Text aus dem Internet</label>
    <textarea id="originalText" rows="10" placeholder="Komplette Stellenanzeige hier einfügen..."></textarea>
  </div>

  <br>
  <button id="analyze">🔍 Text analysieren</button>
</div>

<div class="card">
  <h2>🏢 Firma</h2>

  <div class="grid">
    <div class="field"><label>Firmenname</label><input id="companyName"></div>
    <div class="field"><label>Straße</label><input id="street"></div>
    <div class="field"><label>PLZ</label><input id="zip"></div>
    <div class="field"><label>Ort</label><input id="city"></div>
    <div class="field"><label>Land</label><input id="country"></div>
    <div class="field"><label>Webseite</label><input id="website"></div>
    <div class="field"><label>Verifizierte Seite am</label><input id="verifiedAt"></div>
    <div class="field"><label>Branche</label><input id="industry"></div>
    <div class="field"><label>Unternehmensgröße</label><input id="companySize"></div>
    <div class="field"><label>Telefonnummern, eine pro Zeile</label><textarea id="phones" rows="10"></textarea></div>
    <div class="field"><label>E-Mail-Adressen, eine pro Zeile</label><textarea id="emails" rows="10"></textarea></div>
    <div class="field"><label>Gegründet</label><input id="founded"></div>
  </div>

  <div class="section">
    <h2>💼 Stelle</h2>
    <div class="grid">
      <div class="field"><label>Gesuchte Stelle</label><input id="jobTitle"></div>
      <div class="field"><label>Arbeitsort</label><input id="jobLocation"></div>
      <div class="field"><label>Beschäftigungsart</label><input id="employmentType" placeholder="Vollzeit, Teilzeit ..."></div>
      <div class="field"><label>Arbeitsmodell</label>
        <select id="remote">
          <!-- Wird per JS dynamisch befüllt -->
        </select>
      </div>
      <div class="field"><label>Voraussichtliches Gehalt</label><input id="salary" placeholder="z. B. 55.000–65.000 € brutto/Jahr"></div>
      <div class="field"><label>Kennziffer / Referenznummer</label><input id="referenceNumber"></div>
    </div>
  </div>

  <div class="section">
    <h2>👤 Ansprechpartner</h2>
    <div class="grid">
      <div class="field"><label>Name</label><input id="contactName"></div>
      <div class="field"><label>Position</label><input id="contactRole"></div>
    </div>
  </div>

  <div class="section">
    <h2>📌 Quelle</h2>
    <div class="grid">
      <div class="field"><label>Woher stammt die Stellenanzeige?</label>
        <select id="source">
          <!-- Wird per JS dynamisch befüllt -->
        </select>
      </div>
      <div class="field"><label>Quell-Link</label><input id="jobUrl" placeholder="https://..."></div>
    </div>
  </div>

  <div class="section">
    <h2>📩 Bewerbung</h2>
    <div class="grid">
      <div class="field"><label>Status</label><input id="status"></div>
      <div class="field"><label>Bewerbungsdatum</label><input type="date" id="appliedAt"></div>
      <div class="field"><label>Wie beworben?</label><input id="method" placeholder="E-Mail, Portal, WhatsApp ..."></div>
    </div>
  </div>

  <div class="section">
    <h2>🌐 Online-Portal</h2>
    <div class="grid">
      <div class="field"><label>Portal URL</label><input id="portalUrl"></div>
      <div class="field"><label>Benutzername</label><input id="portalUser"></div>
      <div class="field"><label>Passwort</label><input type="password" id="portalPassword"></div>
    </div>
  </div>

  <div class="section">
    <h2>🎯 Anforderungen</h2>
    <div class="field">
      <label>Muss-Anforderungen</label>
      <textarea id="requiredQualifications" rows="10"></textarea>
    </div>
    <div class="field">
        <label>Fachliche Fähigkeiten / Technologien</label>
        <textarea id="skills" rows="10"></textarea>
    </div>
    <div class="field">
        <label>Wünschenswerte Kenntnisse</label>
        <textarea id="preferredQualifications" rows="10"></textarea>
    </div>
    <div class="field">
        <label>Persönliche Anforderungen</label>
        <textarea id="personalQualifications" rows="10"></textarea>
    </div>
  </div>

  <div class="section">
    <h2>🏭 Firmeninformationen</h2>
    <div class="field">
      <label>💻 Vorstellung der Firma</label>
      <textarea id="companyDescription" rows="10"></textarea>    
    </div>
    <div class="field">
      <label>💻 Welche Arbeiten werden gemacht?</label>
      <textarea id="tasks" rows="10"></textarea>
    </div>
   <div class="field">
      <label>💻 Spezialisierungen (eine pro Zeile)</label>
      <textarea id="specialties" rows="10"></textarea>
    </div>
    <div class="field">
      <label>🎁 Benefits</label>
      <textarea id="benefits" rows="10"></textarea>
    </div>
    <div class="field">
      <label>🎁 Benefits</label>
      <textarea id="socialBenefits" rows="10"></textarea>
    </div>
    <div class="field">
      <label>🌐 Social Impact</label>
      <textarea id="socialImpact" rows="10"></textarea>
    </div>
    <div class="field">
      <label>🌐 Focus</label>
      <textarea id="socialFocus" rows="10"></textarea>
    </div>
  </div>

  <div class="section">
    <h2>📝 Übriges</h2>
    <div class="field">
      <label>Notizen</label>
      <textarea id="notes" rows="10"></textarea>
    </div>
  </div>
</div>
